<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  transition: background 0.2s;
}

body.recording {
  background: #111;
}

#openBtn {
  position: absolute;
  z-index: 10;
  padding: 10px;
  font-size: 14px;
  background: black;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}
</style>
</head>
<body>

<button id="openBtn" onclick="location.href='index.html'">Back</button>

<video id="video" autoplay playsinline style="display:none;"></video>

<script>
let mediaRecorder;
let recordedChunks = [];
let stream;
let isRecording = false;
let isProcessing = false; // prevents double tap bug

const video = document.getElementById('video');

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: true
    });
    video.srcObject = stream;
  } catch (err) {
    alert("Camera permission needed");
  }
}

function startRecording() {
  recordedChunks = [];

  mediaRecorder = new MediaRecorder(stream);

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.start();
  isRecording = true;
  document.body.classList.add("recording");
}

function stopRecording() {
  return new Promise((resolve) => {
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

function download(blob) {
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'video.webm';
  document.body.appendChild(a);
  a.click();

  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 200);
}

document.body.addEventListener('click', async (e) => {
  if (e.target.id === 'openBtn') return;

  // prevent spam / double trigger
  if (isProcessing) return;

  if (!isRecording) {
    startRecording();
  } else {
    isProcessing = true;

    document.body.classList.remove("recording");
    isRecording = false;

    const blob = await stopRecording();
    download(blob);

    // small delay prevents instant re-trigger
    setTimeout(() => {
      isProcessing = false;
    }, 800);
  }
});

startCamera();
</script>

</body>
</html>
