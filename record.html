<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  margin: 0;
  height: 100vh;
  background: black;
  transition: background 0.2s ease;
}

/* recording state */
body.recording {
  background: #111; /* slightly lighter */
}

#openBtn {
  position: absolute;
  z-index: 10;
  padding: 10px;
  font-size: 14px;
  background: black;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
}

video {
  display: none;
}
</style>
</head>
<body>

<button id="openBtn" onclick="location.href='index.html'">Back</button>

<video id="video" autoplay playsinline></video>

<script>
let mediaRecorder;
let recordedChunks = [];
let stream;
let isRecording = false;

const video = document.getElementById('video');

// start camera
async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "environment" },
      audio: true
    });
    video.srcObject = stream;
  } catch (err) {
    alert("Camera/mic permission needed");
    console.error(err);
  }
}

// start recording
function startRecording() {
  recordedChunks = [];

  // better compatibility
  let options = { mimeType: 'video/webm;codecs=vp8,opus' };
  if (!MediaRecorder.isTypeSupported(options.mimeType)) {
    options = { mimeType: 'video/webm' };
  }

  mediaRecorder = new MediaRecorder(stream, options);

  mediaRecorder.ondataavailable = (e) => {
    if (e.data.size > 0) recordedChunks.push(e.data);
  };

  mediaRecorder.start();
  isRecording = true;

  document.body.classList.add("recording");
}

// stop + download
function stopRecording() {
  return new Promise((resolve) => {
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: 'video/webm' });
      resolve(blob);
    };
    mediaRecorder.stop();
  });
}

// download helper (must be user-triggered)
function downloadBlob(blob) {
  const url = URL.createObjectURL(blob);

  const a = document.createElement('a');
  a.href = url;
  a.download = 'video.webm';
  document.body.appendChild(a);
  a.click();

  setTimeout(() => {
    URL.revokeObjectURL(url);
    a.remove();
  }, 200);
}

// tap toggle
document.body.addEventListener('click', async (e) => {
  if (e.target.id === 'openBtn') return;

  if (!isRecording) {
    startRecording();
  } else {
    document.body.classList.remove("recording");
    isRecording = false;

    const blob = await stopRecording();

    // THIS is now directly tied to the tap
    downloadBlob(blob);
  }
});

// init
startCamera();
</script>

</body>
</html>
